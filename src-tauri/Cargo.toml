[package]
name = "familytree"
version = "0.8.0"
description = "Family Tree — genealogy workspace"
authors = ["Casey"]
edition = "2021"
rust-version = "1.77"

[lib]
# The _lib suffix avoids a name clash with the binary on Windows.
name = "familytree_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SQLCipher (SQLite with encryption), built from source with its own copy of OpenSSL
# so nothing extra needs installing on Windows, macOS or Linux.
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "tiff", "bmp"] }
uuid = { version = "1", features = ["v4"] }
ureq = { version = "2.12", default-features = false, features = ["tls", "json", "gzip"] }
# "Keep me signed in": the account key goes in Windows Credential Manager / macOS Keychain.
keyring = { version = "3", features = ["apple-native", "windows-native"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
