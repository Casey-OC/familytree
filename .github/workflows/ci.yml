name: Checks

# Runs once per pull request change (not on every push as well), to save build minutes.
on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit -p tsconfig.json
      - name: Interface tests
        run: npm test
      - name: Build the interface
        run: npx vite build
      - name: Native tests
        working-directory: src-tauri
        run: cargo test

  native-build:
    # Compiles the native side (including the encrypted database) on Windows.
    # macOS is checked when a version tag is released (macOS machines use build minutes 10x faster).
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: NASM (for OpenSSL on Windows)
        if: matrix.platform == 'windows-latest'
        uses: ilammy/setup-nasm@v1
      - name: Placeholder interface
        shell: bash
        run: mkdir -p dist && echo '<html></html>' > dist/index.html
      - name: Native tests
        working-directory: src-tauri
        run: cargo test
