name: Build installers

# Push a version tag (for example v0.1.0), or run this workflow by hand from the
# Actions tab, to build Windows, macOS and Linux installers. They appear as a
# draft GitHub Release for testing.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'macos-latest' # one "universal" app for both Apple Silicon and Intel Macs
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: NASM (for OpenSSL on Windows)
        if: matrix.platform == 'windows-latest'
        uses: ilammy/setup-nasm@v1

      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install app dependencies
        run: npm ci

      - name: Run tests
        if: matrix.platform == 'ubuntu-22.04'
        run: npm test

      - name: Build and upload installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code signing — add these secrets once certificates exist (see docs/HANDOVER.md §8):
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__
          releaseName: 'Family Tree v__VERSION__'
          releaseBody: |
            Download the installer for your computer from **Assets** below.

            **Windows:** download the file ending in `_x64-setup.exe` and double-click it. These test builds aren't signed yet, so Windows may show "Windows protected your PC" — click **More info**, then **Run anyway**. (The `.msi` file is an alternative installer that does the same thing.)

            **Mac:** download the `.dmg`, open it and drag Family Tree into Applications. The first time, right-click (or Control-click) the app and choose **Open**, then **Open** again.

            **Linux:** use the `.AppImage` or `.deb`.

            Your tree is saved on your computer and keeps working without the internet.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
